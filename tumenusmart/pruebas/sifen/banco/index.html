<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pruebas de la factura electrónica (SIFEN)</title>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/banco/muestras-p12.js"></script>
<script src="/banco/base-falsa.js"></script>
<script src="/banco/cargador.js"></script>
</head>
<body>
<pre id="salida" style="font-size:12px;white-space:pre-wrap">Pruebas de la factura electrónica (SIFEN)…</pre>
<script src="/banco/base-simple.js"></script>
<script>
  // Corre las pruebas una detrás de otra y le avisa el resultado a probar.ps1.
  (async () => {
    const correr = (archivo) => new Promise((ok, mal) => {
      window.__listo = false;
      const s = document.createElement("script");
      s.src = "/banco/" + archivo + "?v=" + Date.now();
      s.onerror = () => mal(new Error("no cargó " + archivo));
      document.body.appendChild(s);
      const t = setInterval(() => { if (window.__listo) { clearInterval(t); ok(); } }, 200);
    });
    // ?solo=prueba-ruc.js,prueba-envio.js corre solo esas (para no esperar todo mientras se trabaja en una); sin eso, todas.
    const solo = new URLSearchParams(location.search).get("solo");
    const todas = ["prueba-base.js", "prueba-qr.js", "prueba-firma.js", "prueba-emision.js", "prueba-envio.js", "prueba-eventos.js", "prueba-documento.js", "prueba-ruc.js", "prueba-pedido-web.js"];
    try {
      for (const archivo of solo ? solo.split(",") : todas) await correr(archivo);
    } catch (e) {
      window.__fallas++;
      window.log("ERROR: " + e);
    }
    await fetch("/resultado", { method: "POST", body: JSON.stringify({ aciertos: window.__aciertos, fallas: window.__fallas, salida: document.getElementById("salida").textContent }) });
  })();
</script>
</body>
</html>
